        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function updateMetaTags(post) {
            const title = `${post.title} | The Tailored Experience Travel`;
            const description = post.excerpt;
            const imageUrl = post.mainImage?.asset?.url || '/tailored_experience_logo.png';
            const currentUrl = window.location.href;

            document.getElementById('page-description').setAttribute('content', description);

            document.getElementById('og-title').setAttribute('content', title);
            document.getElementById('og-description').setAttribute('content', description);
            document.getElementById('og-image').setAttribute('content', imageUrl);
            document.getElementById('og-url').setAttribute('content', currentUrl);

            document.getElementById('twitter-title').setAttribute('content', title);
            document.getElementById('twitter-description').setAttribute('content', description);
            document.getElementById('twitter-image').setAttribute('content', imageUrl);

        function renderRelatedPosts(categorySlug) {
            const posts = relatedPostsData[categorySlug] || [];

            if (posts.length === 0) {
                return '<p style="text-align: center; color: var(--text-light); font-family: Inter, sans-serif;">No related posts found.</p>';
            }

            return posts.map(post => `
                <a href="blog-post.html?slug=${post.slug}" class="related-post-card fade-in-element">
                    <div class="related-post-image" style="background-image: url('${post.image}')"></div>
                    <div class="related-post-content">
                        <h3 class="related-post-title">${post.title}</h3>
                        <p class="related-post-excerpt">${post.excerpt}</p>
                        <div class="related-post-meta">${formatDate(post.publishedAt)}</div>
                    </div>
                </a>
            `).join('');
        }

        function renderPortableText(body) {
            if (!body || !Array.isArray(body)) {
                return '<p>No content available.</p>';
            }

            return body.map(block => {
                if (block._type === 'block') {
                    const text = block.children?.map(child => child.text).join('') || '';

                    switch (block.style) {
                        case 'h1':
                            return `<h1>${text}</h1>`;
                        case 'h2':
                            return `<h2>${text}</h2>`;
                        case 'h3':
                            return `<h3>${text}</h3>`;
                        case 'h4':
                            return `<h4>${text}</h4>`;
                        case 'blockquote':
                            return `<blockquote>${text}</blockquote>`;
                        default:
                            return text ? `<p>${text}</p>` : '';
                    }
                }
                return '';
            }).filter(Boolean).join('');
        }

        function calculateReadTime(body) {
            let wordCount = 0;

            if (typeof body === 'string') {
                // If it's HTML string (mock data)
                const textContent = body.replace(/<[^>]*>/g, '');
                wordCount = textContent.split(/\s+/).filter(word => word.length > 0).length;
            } else if (Array.isArray(body)) {
                // If it's Portable Text (Sanity data)
                body.forEach(block => {
                    if (block._type === 'block' && block.children) {
                        block.children.forEach(child => {
                            if (child.text) {
                                wordCount += child.text.split(/\s+/).filter(word => word.length > 0).length;
                            }
                        });
                    }
                });
            }

            // Average reading speed: 200 words per minute
            const readTime = Math.ceil(wordCount / 200);
            return Math.max(1, readTime); // Minimum 1 minute
        }

        function renderBlogPost(post) {

            const authorName = post.author?.name || 'Jessica';
            const authorBio = post.author?.bio || 'Expert Wedding & Travel Planner';
            const authorInitial = authorName.charAt(0).toUpperCase();

            const postContent = `

                        <div class="social-sharing fade-in-element">

        // ==========================================
        // SOCIAL SHARING FUNCTIONS
        // ==========================================

        function shareOnFacebook() {

            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank', 'width=600,height=400');

        function shareOnTwitter() {

            const text = encodeURIComponent(document.title);

        }

        function shareOnLinkedIn() {
            const url = encodeURIComponent(window.location.href);
            window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${url}`, '_blank', 'width=600,height=400');
        }

        function shareViaEmail() {
            const subject = encodeURIComponent(document.title);
            const body = encodeURIComponent(`Check out this article: ${window.location.href}`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        // ==========================================
        // MAIN LOAD FUNCTION
        // ==========================================

        async function loadBlogPost(slug) {
            try {
                const query = `*[_type == "post" && slug.current == "${slug}" && publishedAt <= now()][0] {
                    _id,
                    title,
                    slug,
                    excerpt,
                    publishedAt,
                    mainImage { asset->{ url } },
                    category->{ title, slug },
                    author->{ name, slug, bio },
                    body[]{
                        _type,
                        style,
                        children[]{
                            _type,
                            text
                        }
                    },
                    featured
                }`;

                const url = `https://${sanityClient.projectId}.api.sanity.io/v${sanityClient.apiVersion}/data/query/${sanityClient.dataset}?query=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                const data = await response.json();
                const post = data.result;

                if (!post) {
                    // Fall back to mock data for development
                    const mockPost = mockPosts[slug];
                    if (mockPost) {
                        renderBlogPost(mockPost);
                    } else {
                        throw new Error('Post not found');
                    }
                } else {
                    renderBlogPost(post);
                }

                setTimeout(() => {
                    initScrollAnimations();
                    initHeroAnimation();
                }, 100);

            } catch (error) {
                console.error('Error loading blog post:', error);
                document.getElementById('main-content').innerHTML = `
                    <div class="error-state">
                        <h2>Post Not Found</h2>
                        <p>The blog post you're looking for doesn't exist or has been moved.</p>
                        <a href="blog.html">← Back to Blog</a>
                    </div>
                `;
            }
        }

        // ==========================================
        // ANIMATION FUNCTIONS
        // ==========================================

        function initScrollAnimations() {
            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, {
                    threshold: 0.1,
                    rootMargin: '0px 0px -50px 0px'
                });

                document.querySelectorAll('.fade-in-element').forEach(element => {
                    observer.observe(element);
                });
            }
        }

        function initHeroAnimation() {
            const heroContent = document.querySelector('.hero-animate');
            if (heroContent) {
                heroContent.classList.add('loaded');
            }
        }

        // ==========================================
        // MOBILE MENU
        // ==========================================

        function initMobileMenu() {
            const toggle = document.querySelector('.mobile-menu-toggle');
            const mobileNav = document.querySelector('.mobile-nav');

            if (toggle && mobileNav) {
                toggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    const isExpanded = toggle.getAttribute('aria-expanded') === 'true';

                    toggle.classList.toggle('active');
                    toggle.setAttribute('aria-expanded', !isExpanded);

                    if (!isExpanded) {
                        mobileNav.classList.add('active');
                        mobileNav.style.display = 'block';
                    } else {
                        mobileNav.classList.remove('active');
                        setTimeout(() => {
                            mobileNav.style.display = 'none';
                        }, 300);
                    }
                });

                // Close mobile menu when clicking links
                const links = mobileNav.querySelectorAll('a');
                links.forEach(link => {
                    link.addEventListener('click', () => {
                        toggle.classList.remove('active');
                        mobileNav.classList.remove('active');
                        toggle.setAttribute('aria-expanded', 'false');
                        setTimeout(() => {
                            mobileNav.style.display = 'none';
                        }, 300);
                    });
                });

                // Close mobile menu when clicking outside
                document.addEventListener('click', (e) => {
                    if (!toggle.contains(e.target) && !mobileNav.contains(e.target)) {
                        toggle.classList.remove('active');
                        mobileNav.classList.remove('active');
                        toggle.setAttribute('aria-expanded', 'false');
                        setTimeout(() => {
                            mobileNav.style.display = 'none';
                        }, 300);
                    }
                });
            }
        }
